<svg xmlns="http://www.w3.org/2000/svg">
  <!-- 事件:パトランプ -->
  <symbol id="i-siren" viewBox="0 0 32 32">
    <rect x="5" y="23" width="22" height="6" rx="2" fill="currentColor"/>
    <path d="M9 23v-7a7 7 0 0 1 14 0v7z" fill="currentColor"/>
    <path d="M12.5 21v-5a3.5 3.5 0 0 1 2.6-3.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <path d="M16 2.5v3.5M4.5 8l2.6 2.4M27.5 8l-2.6 2.4"/>
    </g>
  </symbol>
  <!-- 事故:車 -->
  <symbol id="i-car" viewBox="0 0 32 32">
    <path d="M2.5 22v-5a2 2 0 0 1 1.4-1.9L8 13.8l2.2-3.4A2 2 0 0 1 11.9 9.5h7.2a2 2 0 0 1 1.7 1l2.2 3.5 3.4 1.2A2 2 0 0 1 27.5 17v5a1 1 0 0 1-1 1h-23a1 1 0 0 1-1-1z" fill="currentColor"/>
    <path d="M10.4 13.6l1.4-2.3h3.2v2.3zM16.8 11.3h2.4l1.6 2.3h-4z" fill="#fff"/>
    <circle cx="9" cy="23" r="3.2" fill="#fff" stroke="currentColor" stroke-width="2.2"/>
    <circle cx="22" cy="23" r="3.2" fill="#fff" stroke="currentColor" stroke-width="2.2"/>
    <path d="M27 2.5l1 2.7 2.7 1-2.7 1-1 2.7-1-2.7-2.7-1 2.7-1z" fill="#f2b705"/>
  </symbol>
  <!-- 火災:炎 -->
  <symbol id="i-fire" viewBox="0 0 32 32">
    <path d="M16 2c1 5.5 7.500 8.500 7.500 15.500a7.500 7.500 0 0 1-15 0c0-3.200 1.500-5.300 3.200-6.800.3 2.100 1.200 3.200 2.400 3.700C13.800 10 14.400 5.500 16 2z" fill="currentColor"/>
    <path d="M16 16c.9 2.100 3.200 3.200 3.200 5.800a3.200 3.200 0 0 1-6.400 0c0-1.700 1-2.600 1.700-3.400.4.900 1 1.400 1.500 1.500-.1-1.400 0-2.800 0-3.900z" fill="#ffd54a"/>
  </symbol>
  <!-- 災害:雨雲と雷 -->
  <symbol id="i-storm" viewBox="0 0 32 32">
    <path d="M9 19.500a5.500 5.500 0 0 1-.7-10.950A7.500 7.500 0 0 1 22.600 7.600 6 6 0 0 1 23 19.500z" fill="currentColor"/>
    <path d="M17.500 15.500l-4.500 7h3.300l-1.800 6.500 5.800-8.200h-3.500z" fill="#ffd54a" stroke="#fff" stroke-width=".8" stroke-linejoin="round"/>
    <path d="M7.500 22.500L6 26M25 22.500L23.500 26" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"/>
  </symbol>
  <!-- 催し:花火 -->
  <symbol id="i-fireworks" viewBox="0 0 32 32">
    <g stroke="currentColor" stroke-width="2.400" stroke-linecap="round">
      <path d="M16 2.500v5M16 20.500v5M3.500 14h5M23.500 14h5M7.200 5.200l3.500 3.500M21.300 19.300l3.500 3.500M24.800 5.200l-3.500 3.500M10.700 19.300l-3.500 3.500"/>
    </g>
    <circle cx="16" cy="14" r="3" fill="currentColor"/>
    <circle cx="6" cy="27" r="1.800" fill="#f2b705"/>
    <circle cx="26" cy="28" r="1.800" fill="#f2b705"/>
    <circle cx="16" cy="29" r="1.500" fill="#f2b705"/>
  </symbol>
  <!-- すべて:4つのまど -->
  <symbol id="i-all" viewBox="0 0 32 32">
    <rect x="4" y="4" width="11" height="11" rx="3" fill="currentColor"/>
    <rect x="17" y="4" width="11" height="11" rx="3" fill="currentColor" opacity=".7"/>
    <rect x="4" y="17" width="11" height="11" rx="3" fill="currentColor" opacity=".7"/>
    <rect x="17" y="17" width="11" height="11" rx="3" fill="currentColor"/>
  </symbol>
  <!-- 時計 -->
  <symbol id="i-clock" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M16 9v7l5 3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <!-- 場所 -->
  <symbol id="i-pin" viewBox="0 0 32 32">
    <path d="M16 29S6 19.500 6 12.500a10 10 0 0 1 20 0C26 19.500 16 29 16 29z" fill="currentColor"/>
    <circle cx="16" cy="12.500" r="4" fill="#fff"/>
  </symbol>
  <!-- カレンダー -->
  <symbol id="i-cal" viewBox="0 0 32 32">
    <rect x="4" y="6" width="24" height="22" rx="4" fill="currentColor"/>
    <rect x="4" y="6" width="24" height="7" rx="3" fill="currentColor"/>
    <rect x="8" y="16" width="16" height="9" rx="1.500" fill="#fff"/>
    <path d="M10 3v6M22 3v6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 20h4M17 20h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <!-- 新聞 -->
  <symbol id="i-news" viewBox="0 0 32 32">
    <rect x="4" y="5" width="24" height="22" rx="3" fill="currentColor"/>
    <rect x="8" y="9" width="8" height="7" rx="1" fill="#fff"/>
    <path d="M19 10h5M19 14h5M8 20h16M8 24h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <!-- 朝 -->
  <symbol id="i-sunrise" viewBox="0 0 32 32">
    <path d="M7 22a9 9 0 0 1 18 0z" fill="currentColor"/>
    <path d="M2.500 26h27" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"/>
    <path d="M16 4v5M5.500 11l3 3M26.500 11l-3 3M2.500 20h3M26.500 20h3" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"/>
  </symbol>
  <!-- 昼 -->
  <symbol id="i-sun" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="6.500" fill="currentColor"/>
    <path d="M16 2.500v4M16 25.500v4M2.500 16h4M25.500 16h4M6.400 6.400l2.800 2.800M22.800 22.800l2.800 2.800M25.600 6.400l-2.800 2.800M9.200 22.800l-2.800 2.800" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"/>
  </symbol>
  <!-- 夕 -->
  <symbol id="i-sunset" viewBox="0 0 32 32">
    <path d="M6 20a10 10 0 0 1 20 0z" fill="currentColor"/>
    <path d="M3 24h26M8 28h16" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"/>
    <path d="M16 5v4M6 11l2.800 2.800M26 11l-2.800 2.800" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"/>
  </symbol>
  <!-- 夜 -->
  <symbol id="i-moon" viewBox="0 0 32 32">
    <path d="M21 3.500a12.500 12.500 0 1 0 8 22.500A10.500 10.500 0 0 1 21 3.500z" fill="currentColor"/>
    <path d="M25 6l.9 2.200 2.200.9-2.200.9L25 12.200l-.9-2.200-2.200-.9 2.200-.9z" fill="#f2b705"/>
  </symbol>
  <!-- 桃(ロゴ) -->
  <symbol id="i-peach" viewBox="0 0 32 32">
    <path d="M16 29c-7 0-11-5-11-10 0-6 4-10 9-10 1 0 1.600.3 2 .5.4-.2 1-.5 2-.5 5 0 9 4 9 10 0 5-4 10-11 10z" fill="#ff8fa6"/>
    <path d="M16 10c-2 4-2.500 11 0 18" stroke="#e0607f" stroke-width="1.600" fill="none" stroke-linecap="round"/>
    <path d="M9 15c.5-2.500 2.200-4 4-4.500" stroke="#ffc2cf" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M16 9c0-3.500 2.200-6 6.500-6-.5 4-3 6.500-6.500 6z" fill="#3fae68"/>
  </symbol>
  <!-- ねむる桃(記事なし) -->
  <symbol id="i-empty" viewBox="0 0 32 32">
    <path d="M16 29c-7 0-11-5-11-10 0-6 4-10 9-10 1 0 1.600.3 2 .5.4-.2 1-.5 2-.5 5 0 9 4 9 10 0 5-4 10-11 10z" fill="#ffb3c2"/>
    <path d="M16 9c0-3.500 2.200-6 6.500-6-.5 4-3 6.500-6.500 6z" fill="#3fae68"/>
    <path d="M10.500 18.500q1.800 1.800 3.600 0M17.900 18.500q1.800 1.800 3.600 0" stroke="#7a3347" stroke-width="1.600" fill="none" stroke-linecap="round"/>
    <path d="M14.500 23.500q1.500 1.200 3 0" stroke="#7a3347" stroke-width="1.600" fill="none" stroke-linecap="round"/>
  </symbol>
  <!-- さがす -->
  <symbol id="i-search" viewBox="0 0 32 32">
    <circle cx="14" cy="14" r="8.500" fill="none" stroke="currentColor" stroke-width="3.200"/>
    <path d="M20.500 20.500L28 28" stroke="currentColor" stroke-width="3.600" stroke-linecap="round"/>
  </symbol>
  <!-- 文字の大きさ -->
  <symbol id="i-text" viewBox="0 0 32 32">
    <path d="M3 25L10 6l7 19M5.500 19h9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 25l4.500-12L29 25M21.500 21.500h6" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <!-- 運営者:人 -->
  <symbol id="i-info" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="13" fill="currentColor"/>
    <circle cx="16" cy="9.500" r="2" fill="#fff"/>
    <path d="M16 14v9" stroke="#fff" stroke-width="3.200" stroke-linecap="round"/>
  </symbol>
  <!-- 収集方法:じょうご+書類 -->
  <symbol id="i-doc" viewBox="0 0 32 32">
    <path d="M7 3h13l6 6v20H7z" fill="currentColor"/>
    <path d="M20 3v6h6" fill="#fff" opacity=".55"/>
    <path d="M11 14h11M11 19h11M11 24h7" stroke="#fff" stroke-width="2.200" stroke-linecap="round"/>
  </symbol>
  <!-- 免責:注意 -->
  <symbol id="i-warn" viewBox="0 0 32 32">
    <path d="M16 3.500L30 28H2z" fill="currentColor" stroke="currentColor" stroke-width="2.400" stroke-linejoin="round"/>
    <path d="M16 12v8" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="16" cy="24" r="1.800" fill="#fff"/>
  </symbol>
  <!-- プライバシー:かぎ -->
  <symbol id="i-lock" viewBox="0 0 32 32">
    <rect x="5" y="14" width="22" height="15" rx="3.500" fill="currentColor"/>
    <path d="M10 14v-3.500a6 6 0 0 1 12 0V14" fill="none" stroke="currentColor" stroke-width="3.200"/>
    <circle cx="16" cy="21" r="2.400" fill="#fff"/>
  </symbol>
  <!-- お問い合わせ:封筒 -->
  <symbol id="i-mail" viewBox="0 0 32 32">
    <rect x="3" y="7" width="26" height="19" rx="3.500" fill="currentColor"/>
    <path d="M5 10l11 9 11-9" fill="none" stroke="#fff" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
