name: collect

on:
  schedule:
    # 毎時 5分と35分 に「集め損ねていないか」を確認します。
    # 毎時0分を過ぎて未収集なら、その場で集めます(5分に集め、35分は集め済みなので何もしません)。
    # 5分と35分にしているのは、GitHubの混雑する毎時0分を避けるためです。
    - cron: '5,35 * * * *'
  workflow_dispatch:         # 手動実行ボタン(押すと必ず集めます)

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect news and build site
        id: collect
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python collect.py

      - uses: actions/configure-pages@v5
        if: steps.collect.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.collect.outputs.skip != 'true'
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.collect.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      - name: Save data.json
        if: steps.collect.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "auto: update $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main
