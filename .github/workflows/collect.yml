name: okayama-news-collect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
      - "scripts/collect.py"
  schedule:
    # 日本時間 = UTC + 9時間
    # 毎時0分ちょうどは GitHub が混み合って遅れたり飛ばされたりするため、少しずらしています
    - cron: "7 20 * * *"    # 日本時間 05:07
    - cron: "37 2 * * *"    # 日本時間 11:37
    - cron: "7 10 * * *"    # 日本時間 19:07
    - cron: "7 13 * * *"    # 日本時間 22:07
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect news
        run: python scripts/collect.py

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
